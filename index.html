<!doctype html>
<html lang="en">
  <head>
<style>
.container {
  display: grid;
  grid-template-areas:
    "header header"
    "header1 header1"
    "menu content"
    "footer footer";
  grid-template-columns: 1fr 3fr;
  gap: 3px;
  background-color: dodgerblue;
  padding: 5px;
}
.container div {
  background-color: white;
  padding: 10px;
}
.container div.header {
  grid-area: header;
  text-align: center;
}
.container div.header1 {
  grid-area: header1;
  text-align: center;
  display: flex;
  justify-content: center;
  gap: 40px;
}
.container div.menu {
  grid-area: menu;
}
.container div.content {
  grid-area: content;
}
.container div.footer {
  grid-area: footer;
  text-align: center;  
}
</style>

    <meta charset="UTF-8" />
    <meta name="viewport"
      content="width=device-width,
      initial-scale=1" />
    <title>Campus Notices</title>
    <link rel="stylesheet" href="style.css" />
    
    </head>
    <body>
      <h1>Campus Notices</h1>
      <div class="container">
  <div class="header"><img src="images.png" width="100" height="100" style="float:left"><h2>Don Mariano Marcos Memorial State University</h2></div>
  <div class="header1"><a href="#">HOME</a><a href="#">ABOUT</a><a href="#">CONTACT US</a></div>
  <div class="menu"><h2>Campus Notices</h2><br><img src="pic1.jpg" width="50" height="50" style="float:left"></div>
  <div class="content"><p>
    <label for="title">Title:</label>
      <input id="title" name="title"
             type"title" required /></p></div>
  <div class="footer"><h1>College Of Computer Science</h1></div>
  </div>



     
      </body>


</html>
